<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop Login</title>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8e8ff;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #a45bb5;
            margin-bottom: 5px;
        }

        h2 {
            color: #b667c5;
        }

        form {
            background-color: white;
            width: 300px;
            margin: 25px auto;
            padding: 25px;
            border: 3px solid #d9a7e8;
            border-radius: 12px;
        }

        label {
            color: #875494;
            font-weight: bold;
        }

        input {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #d9a7e8;
            border-radius: 5px;
        }

        button {
            padding: 9px 22px;
            background-color: #d58adf;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #bd6dca;
        }

        #message {
            color: #d14f8f;
        }
    </style>
</head>

<body>

    <h1>♡ Juice Shop ♡</h1>
    <h2>Login</h2>

    <form id="loginForm">
        <div>
            <label for="email">Email:</label>
            <br>
            <input
                type="text"
                id="email"
                name="email"
                placeholder="user@example.com"
            >
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
            >
        </div>

        <br>

        <button type="submit">Login ♡</button>
    </form>

    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
